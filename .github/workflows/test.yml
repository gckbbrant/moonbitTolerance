name: MoonBit checks

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION='0.10.9+6e6c44045' bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MOONBIT_INSTALL_VERSION = "0.10.9+6e6c44045"
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          echo "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Format and type check
        run: |
          moon version --all
          moon fmt --check
          moon check --deny-warn

      - name: Build and run example
        run: |
          moon build --target all
          moon run cmd/main

      - name: Generate and verify public interface
        run: |
          moon info
          git diff --exit-code -- pkg.generated.mbti cmd/main/pkg.generated.mbti

      - name: Test wasm-gc with coverage
        run: |
          moon test --target wasm-gc --deny-warn --enable-coverage
          moon coverage report -f summary
          moon coverage analyze
      - name: Test native with coverage
        run: |
          moon test --target native --deny-warn --enable-coverage
          moon coverage report -f summary
          moon coverage analyze
